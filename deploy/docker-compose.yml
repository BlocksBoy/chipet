# Chipet 静态站 + AI API（弗吉尼亚）。与 S-UI VPN 并存：宿主机映射 8443→443。
#   docker compose --env-file .env.deploy up -d
services:
  api:
    image: chipet-api:latest
    restart: unless-stopped
    env_file:
      - .env.api
    environment:
      PORT: "8787"
    expose:
      - "8787"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-chipet.web3book.io}
    ports:
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - ./frontend-dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
